# Trivy accepted-risk register for the Shipwright monorepo's OWN self-scan.
#
# Entries here are DOCUMENTED, SCOPED, and TIME-BOUNDED risk acceptances — not
# blanket suppressions. Each MUST carry an `expired_at` (re-review date) and a
# `statement` (why it is accepted). Trivy applies this file via `--ignorefile`,
# wired in plugins/shipwright-security/scripts/lib/oss_backend.py::_run_trivy
# (keyed to the scanned target root, so it works identically in CI and locally).
#
# This is for findings assessed as non-exploitable in THIS repo and chosen not
# to fix — NOT a place to silence real, reachable vulns. Prefer a root
# remediation (dependency bump) whenever one exists.
#
# `expired_at` here is deliberately ONE DAY AFTER the matching `expires` in
# shipwright_accepted_risks.yaml, and must stay that way — do not "tidy" them
# into agreement. The two fields lapse on different days by their owners'
# definitions: a register entry is still active ON its `expires`, while Trivy
# stops applying an entry FROM its `expired_at` (it parses the date to midnight;
# pkg/result/ignore.go skips on `ExpiredAt.Before(now)`). Setting both to the
# same day therefore leaves one day on which the scanner has stopped suppressing
# while the acceptance is still current — the drift gate reports STALE and CI
# goes red with nothing actually due. `test_ignore_entries_outlive_their_register_entry`
# pins the offset. See iterate-2026-07-31-accepted-risk-gate-holes.
vulnerabilities:
  - id: CVE-2026-54285
    paths:
      - "plugins/shipwright-test/scripts/perf/package-lock.json"
    expired_at: 2026-12-23
    statement: >-
      Accepted risk; re-review 2026-12-22. @opentelemetry/core 1.30.1 —
      "unbounded memory allocation in W3C Baggage propagation". Transitive and
      dev-only: it reaches this repo solely through the Lighthouse perf-runner
      (lighthouse -> @sentry/node -> @opentelemetry/*), whose Sentry OTel
      tracing is never initialized; the runner is a client driving Chrome with
      no untrusted W3C Baggage header input, so the vulnerable path is not
      reachable. The only fix (2.8.0) is a MAJOR bump the pinned tree refuses —
      @opentelemetry/resources / sdk-trace-base / instrumentation-http require
      exactly 1.30.1 and @sentry/node caps <2.0.0. Re-fix when lighthouse ships
      an OTel-2.x dependency tree. Origin: iterate-2026-06-22-trivy-risk-accept.
  - id: CVE-2026-14257
    paths:
      - "plugins/shipwright-test/scripts/perf/package-lock.json"
    expired_at: 2027-01-29
    statement: >-
      Accepted risk; re-review 2027-01-28. brace-expansion 2.1.2 — "DoS via
      unbounded expansion length causing an out-of-memory process crash":
      expand() bounds the result COUNT (`max`, default 100k) but not the
      accumulated string LENGTH, so chained brace groups exhaust memory.
      Verified present in the installed copy (no `maxLength` option).
      Transitive and dev-only: it reaches this repo solely through the
      Lighthouse perf-runner (lighthouse -> minimatch -> brace-expansion),
      which globs local paths while driving Chrome against the project's own
      dev URL — no attacker-influenced brace/glob pattern reaches expand().
      No fix exists for this tree: minimatch 9.0.9 requires ^2.0.2 and the fix
      landed only in 5.0.8, a two-major jump reachable solely by a forced npm
      `overrides`. The v2 maintenance line has NO backport — 2.1.2 is its head
      and was published 2026-07-08, fifteen days BEFORE the 5.0.8 fix
      (2026-07-23); the `maintenance-v2` dist-tag means maintained, not
      patched. Re-fix when a 2.1.3 backport ships or lighthouse moves minimatch
      off the v2 line. Origin:
      iterate-2026-07-28-security-pyasn1-bump-brace-accept.
