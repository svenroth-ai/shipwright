name: PR Review Run

# Stage 2 of the two-stage Tier-3 PR review (FR-01.17).
#
# Triggered by stage 1 (`pr-review.yml`) completing. Because `workflow_run` runs
# in the BASE repository's context, this stage has the credentials that a fork's
# `pull_request` run is denied — which is the whole reason fork PRs previously
# got no review at all.
#
# THE TRUST RULE, and why it is absolute:
# `pull_request` runs the workflow file FROM THE PR HEAD. A contributor — fork or
# branch — therefore controls stage 1 completely: its tier decision, its
# metadata, and the diff it uploads. Nothing stage 1 produces may be treated as
# authoritative here. An earlier draft of this workflow read `needs_review` from
# stage 1's artifact and skipped the review when it said `false`; that let a PR
# declare itself exempt and collect a green `PR Review` status — the exact
# self-exemption FR-01.17 (E)7 forbids. Caught in external review before merge.
#
# So stage 2 derives EVERYTHING it acts on from trusted sources:
#   1. Identity — PR number resolved from `github.event.workflow_run.head_sha`
#      (trusted event field) via the API. `workflow_run.pull_requests` is empty
#      for fork PRs, so it is not used.
#   2. Authorisation — labels and changed paths read from the API, and
#      the tier rules applied HERE, in default-branch code the contributor
#      cannot edit.
#   3. Content — the diff fetched from the API at the trusted head SHA, never
#      taken from the artifact.
# The contributor's code is never checked out and never executed: the checkout
# below takes the base repo, and the diff is only ever read as text.
#
# This workflow is the SOLE producer of the required `PR Review` status context.
# If it never posts — crash, cancellation, missing secret — the context stays
# absent, and an absent required context is `pending`, which blocks the merge.
# FR-01.17 (E)2: silence counts as not passing, not as passing.

on:
  workflow_run:
    workflows: ["PR Review Prepare"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pr-review-run-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    name: Review and post verdict
    runs-on: ubuntu-latest
    # Only this job widens, and only to what posting the verdict needs:
    # statuses:write for the required context, pull-requests:write for the
    # comment carrying the reasons and issues:write consumes a one-shot waiver (FR-01.17 (E)4).
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
      # Read-only, and only to police the context: stage 1 runs from the PR
      # head, so a contributor can rename a job to `PR Review` and manufacture
      # a passing check run under the required name. We must be able to see it.
      checks: read
    steps:
      # Base repo only. No `ref:`, so this is the default branch of the base
      # repository — the PR head is never checked out.
      # Nothing in this job uses the git credential helper: `gh` authenticates
      # from GH_TOKEN. The job holds an LLM key and writable token, so checkout
      # must not leave another credential in .git/config for later steps.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        # Third-party action pinned to a full commit SHA (supply-chain
        # hardening); trailing comment records the human-readable tag.
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Resolve pull request from the trusted event
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A commit can be associated with SEVERAL open PRs. Taking the first
          # would let us review one PR's diff and post a green status onto a SHA
          # that satisfies a DIFFERENT PR's gate. Require exactly one open PR
          # whose CURRENT head is this exact SHA, and fail closed otherwise —
          # ambiguity here is indistinguishable from an attack.
          #
          # We LIST THE BASE REPO'S OPEN PRS and match on head SHA. The prior
          # form asked commits/{sha}/pulls, and that endpoint returns an EMPTY
          # LIST for a pull request raised from a FORK — the commit lives in
          # the fork's object store, not the base repo's. Verified against
          # three real fork PRs on cli/cli: all three resolve through this
          # query and none through commits/{sha}/pulls. The old form left
          # every fork PR unresolvable and permanently red WITHOUT EVER BEING
          # REVIEWED — the exact case this two-stage split exists to fix,
          # inverted into an availability regression no same-repo PR would
          # ever reveal (shipwright-webui#338, doubt-reviewer finding 26).
          #
          # --paginate --slurp (pages flattened by .[][]): a match beyond page
          # 1 must not read as absent, and a SECOND match beyond it must not
          # collapse a two-match ambiguity into an apparent unique one.
          matches=$(gh api --paginate --slurp "repos/$REPO/pulls?state=open&per_page=100" \
            | jq --arg sha "$HEAD_SHA" \
                '[.[][] | select(.state == "open") | select(.head.sha == $sha) | .number]')
          count=$(printf '%s' "$matches" | jq 'length')
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one open PR whose head is $HEAD_SHA, found $count — refusing to post a verdict"
            exit 1
          fi
          echo "number=$(printf '%s' "$matches" | jq -r '.[0]')" >> "$GITHUB_OUTPUT"

      # The tier decision lives HERE, not in stage 1, and reads only API data.
      # Stage 1's copy of these rules would be attacker-editable.
      - name: Decide the tier from trusted API data
        id: tier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          labels=$(printf '%s' "$pr_json" | jq -c '[.labels[].name]')
          changed=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')

          # Both sides of a rename are policy-relevant: otherwise moving a
          # suppression or hook-control file to an innocuous path makes the
          # waiver decision see only the destination. GitHub caps this endpoint
          # at 3,000 files even when paginated, so an incomplete list is also
          # sensitive rather than evidence that no protected path changed.
          if [ "$(wc -l <<<"$changed")" -ge 3000 ]; then
            echo "::notice::changed-file list is at the API cap — review required"
            changed="${changed}"$'\n'sensitive_path_list_truncated
          fi

          # The label is authorization to consider a waiver, not authorization
          # for any later push. Require an approval whose GitHub API commit_id
          # is this exact event SHA, from a non-author collaborator with write,
          # maintain, or admin permission. PR-head content cannot forge either.
          pr_author=$(printf '%s' "$pr_json" | jq -r '.user.login')
          approved_reviewers=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            | jq -r --arg sha "$HEAD_SHA" --arg author "$pr_author" \
              '[.[][] | select(.commit_id == $sha and .user.login != $author)] | sort_by(.submitted_at) | group_by(.user.login) | map(last | select(.state == "APPROVED") | .user.login) | .[]')
          trusted_head_approval=false
          while IFS= read -r reviewer; do
            [ -n "$reviewer" ] || continue
            if permission=$(gh api "repos/$REPO/collaborators/$reviewer/permission" --jq '.permission'); then
              case "$permission" in
                admin|maintain|write) trusted_head_approval=true; break ;;
              esac
            fi
          done <<< "$approved_reviewers"

          head_repo=$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name // empty')
          if [ -z "$head_repo" ]; then
            echo "::error::PR head repository is unavailable — refusing to trust review evidence"
            exit 1
          fi


          changed_paths_file=$(mktemp)
          review_record_file=$(mktemp)
          trap 'rm -f "$changed_paths_file" "$review_record_file"' EXIT
          printf '%s\n' "$changed" > "$changed_paths_file"
          review_record_path=$(printf '%s\n' "$changed" \
            | { grep -E '^\.shipwright/planning/iterate/[A-Za-z0-9._-]+/reviews\.json$' || [ $? -eq 1 ]; })
          if [ "$(printf '%s\n' "$review_record_path" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1 ]; then
            if gh api "repos/$head_repo/contents/$review_record_path?ref=$HEAD_SHA" \
              --jq '.content' | tr -d '\n' | base64 --decode > "$review_record_file"; then
              :
            else
              : > "$review_record_file"
              echo "::notice::review evidence unavailable at the PR head; Tier-3 review is required"
            fi
          fi
          if [ "$trusted_head_approval" = true ]; then
            trusted_head_approval_arg=--trusted-head-approval
          else
            trusted_head_approval_arg=
          fi
          uv run plugins/shipwright-security/scripts/tools/review_record_tier.py \
            --changed-paths-file "$changed_paths_file" \
            --labels-json "$labels" \
            --review-record-file "$review_record_file" \
            $trusted_head_approval_arg >> "$GITHUB_OUTPUT"

      # The helper treats .github/workflows/ and shared/scripts/lib/ as
      # sensitive surfaces, so a waiver never covers the checks or executable
      # review-record dependencies it relies on.
      # Labels persist across pushes. Consume an evidence-backed waiver before
      # any later push can inherit it; a new head must receive a fresh, trusted
      # maintainer authorization rather than borrowing this one.
      - name: Consume the one-shot review waiver
        id: consume_waiver
        if: steps.tier.outputs.needs_review == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if ! gh api --method DELETE "repos/$REPO/issues/$PR_NUMBER/labels/skip-pr-review" >/dev/null; then
            # A missing label or API error is not idempotent here: it could mean
            # another actor consumed the waiver. Leave the gate fail-closed.
            echo "::error::could not consume the one-shot review waiver"
            exit 1
          fi


      - name: Run Tier-3 PR review
        id: review
        if: >-
          github.event.workflow_run.conclusion == 'success' &&
          steps.tier.outputs.needs_review == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Default swapped from DeepSeek to GLM 5.3 after DeepSeek repeatedly
          # (3x, PR #668) produced a confident, wrong BLOCK verdict — a
          # model-quality regression, not an infra defect. GLM 5.3 is ZDR-vetted
          # on the SAME two allowlisted providers as DeepSeek (novita, together)
          # via OpenRouter's data-policy API (2026-09-01) AND a live production-route
          # completion probe (scripts/tools/probe_glm_zdr.py,
          # .shipwright/planning/iterate/iterate-2026-09-01-pr-review-glm-model/
          # glm-zdr-probe.json). Unlike DeepSeek — where `together` has no endpoint
          # for that model at all — `together` DOES serve GLM 5.3, though at lower
          # measured uptime than `novita` (checked via OpenRouter's endpoints API);
          # `novita` is what the probe's live request actually landed on. DeepSeek
          # stays available as an operator override on this same env var. A rollback
          # PR editing this line is itself Tier-3 and reviewed by THIS file as
          # committed on the default branch (workflow_run always runs the base
          # branch's workflow, never the PR's) — so a maintainer's
          # `gh pr merge --admin` is the recovery path if this model's own
          # verdicts ever need bypassing, with the internal review passes
          # (spec/code/doubt) still required as evidence
          # (iterate-2026-09-01-pr-review-glm-model).
          SHIPWRIGHT_PR_REVIEW_MODEL: z-ai/glm-5.3
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The diff comes from the API at the trusted head SHA. pr_review.py
          # fetches it itself via `gh pr diff`; the artifact stage 1 uploaded is
          # an audit record only and is deliberately not read here.
          uv run plugins/shipwright-security/scripts/tools/pr_review.py \
            --pr-number "$PR_NUMBER" \
            --repo "$REPO" \
            --prompt-dir shared/prompts/pr_reviewer

      # The verdict is the gate. It runs after ordinary failures so it can post
      # `failure`, but never after this job was cancelled. `always()` is true
      # for a cancelled job; a superseded run could otherwise overwrite the
      # live verdict from its newer concurrency-group peer.
      - name: Post the PR Review verdict
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          STAGE1_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          NEEDS_REVIEW: ${{ steps.tier.outputs.needs_review }}
          TIER_REASON: ${{ steps.tier.outputs.reason }}
          CONSUME_WAIVER_OUTCOME: ${{ steps.consume_waiver.outcome }}
          TIER_OUTCOME: ${{ steps.tier.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -euo pipefail
          : "${RUN_STARTED_AT:?workflow_run.run_started_at is required}"
          # The reviewer fetched the diff by PR NUMBER, which tracks the moving
          # head; the verdict lands on the immutable event SHA. If the branch was
          # force-pushed mid-run we reviewed different content than we are about
          # to bless — and a later restore of this SHA would inherit the green.
          # Comparing the current head alone is insufficient: an A -> B -> A
          # force-push sequence passes that comparison although the reviewer saw
          # B. Reject any force-push since stage 1 began.
          stale=""
          if [ -n "${PR_NUMBER:-}" ]; then
            if ! now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha'); then
              stale="could not verify head — re-run required"
            elif ! forced=$(gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/timeline" \
              | jq --arg t "$RUN_STARTED_AT" \
                  '[.[][] | select(.event == "head_ref_force_pushed")
                          | select(.created_at >= $t)] | length'); then
              stale="could not verify branch history — re-run required"
            elif ! [[ "$forced" =~ ^[0-9]+$ ]]; then
              # A malformed or empty pagination result must never be treated as
              # proof that no force-push occurred during the review window.
              stale="could not verify branch history — re-run required"
            elif [ "$now" != "$HEAD_SHA" ] || [ "$forced" != "0" ]; then
              stale="head moved during review — re-run required"
              echo "::error::head moved during the run ($HEAD_SHA -> ${now:-unknown}, $forced force-push(es) since stage 1 began); the review does not describe this commit"
            fi
          fi
          # Stage 1 executes the PR's workflow file. A contributor can rename a
          # stage-1 job to `PR Review`, creating a passing check run under the
          # required name. This workflow is the sole permitted producer, so do
          # not post when another check run already claims the context. Its own
          # check run is expected and identifies this run in details_url.
          if [ -z "$stale" ]; then
            if ! impostors=$(gh api --paginate --slurp "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              | jq --arg run "$RUN_URL" \
                  '[.[].check_runs[] | select(.name == "PR Review")
                                    | select((.details_url // "") | startswith($run) | not)] | length'); then
              stale="could not verify check runs — re-run required"
            elif ! [[ "$impostors" =~ ^[0-9]+$ ]]; then
              stale="could not verify check runs — re-run required"
            elif [ "$impostors" -ne 0 ]; then
              echo "::error::$impostors check run(s) named 'PR Review' exist on $HEAD_SHA; this workflow is the only permitted producer of that context"
              stale="a second producer is claiming this context — re-run required"
            fi
          fi
          if [ -n "$stale" ]; then
            gh api "repos/$REPO/statuses/$HEAD_SHA" -f state=failure \
              -f context="PR Review" \
              -f description="$stale" \
              -f target_url="$RUN_URL" >/dev/null
            exit 1
          fi
          if [ "$STAGE1_CONCLUSION" != "success" ]; then
            state=failure; desc="preparation stage failed — nothing was reviewed"
          elif [ "$TIER_OUTCOME" != "success" ]; then
            state=failure; desc="could not determine whether a review was required"
          elif [ "$NEEDS_REVIEW" = "false" ] && [ "$CONSUME_WAIVER_OUTCOME" != "success" ]; then
            state=failure; desc="review waiver consumption failed — review required"
          elif [ "$REVIEW_OUTCOME" = "success" ]; then
            state=success; desc="reviewed — no blocking findings"
          elif [ "$NEEDS_REVIEW" = "false" ] && [ "$CONSUME_WAIVER_OUTCOME" = "success" ]; then
            state=success; desc="$TIER_REASON"
          else
            state=failure; desc="review blocked or did not complete"
          fi
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="PR Review" \
            -f description="${desc:0:139}" \
            -f target_url="$RUN_URL" >/dev/null
          echo "posted PR Review=$state ($desc)"
          [ "$state" = "success" ]
