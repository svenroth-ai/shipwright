name: PR Review Prepare

# Stage 1 of the two-stage Tier-3 PR review (FR-01.17).
#
# This stage runs on EVERY pull request, including one raised from a fork, and
# holds NO credentials. Its jobs do two things: trigger stage 2
# (`pr-review-run.yml`, which fires on this workflow's completion and holds the
# credentials), and record what the contributor proposed.
#
# Why the split: GitHub withholds secrets from `pull_request` runs raised from a
# fork, so the reviewer could not run on them at all. The previous shape guarded
# its `decide` job on `head.repo.full_name == github.repository`; on a fork PR
# that job was skipped, `review` was skipped through `needs:`, and **GitHub
# scores a skipped job as a SUCCESSFUL required check** — the required
# `PR Review` context went green having reviewed nothing.
#
# NOTHING THIS STAGE PRODUCES IS TRUSTED. `pull_request` runs the workflow file
# from the PR head, so a contributor controls this file and everything it emits.
# The uploaded artifact is an AUDIT RECORD of what stage 1 saw — stage 2 reads
# no authorisation, no identity and no diff from it. The tier decision and the
# reviewed diff are derived in stage 2 from the API, in default-branch code the
# contributor cannot edit. An earlier draft put the tier decision here and let
# stage 2 honour it; that allowed a PR to declare itself exempt and collect a
# green status. Do not move policy back into this file.
#
# Required status check: `PR Review` is NOT produced here. It is a commit status
# posted by stage 2. That is deliberate and load-bearing — if stage 2 never
# reports, the context is absent, and an absent required context is `pending`,
# which blocks the merge. FR-01.17 (E)2: silence counts as not passing.
# Nothing in this file may emit a check run under that name; two producers of
# one context is the ambiguity GitHub's own docs warn against.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

# Read-only token (OpenSSF Scorecard Token-Permissions). This stage reads an
# attacker-influenced diff and needs nothing beyond reading it.
permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare review request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record the change for audit
        # github context is hoisted into env vars; the run body never
        # interpolates ${{ github.* }} directly (run-shell-injection guard,
        # semgrep yaml.github-actions.security.run-shell-injection).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p pr-review-request
          git diff "$BASE_SHA" "$HEAD_SHA" > pr-review-request/pr.diff
          jq -n --arg pr "$PR_NUMBER" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            '{pr_number: $pr, head_sha: $head, base_sha: $base}' \
            > pr-review-request/meta.json

      - uses: actions/upload-artifact@v4
        with:
          name: pr-review-request
          path: pr-review-request/
          retention-days: 3
