name: Bloat Check

# Runs the anti-ratchet gate on every PR.  Posts an idempotent PR comment
# with the allowlist diff vs the base ref.  Exit 1 ONLY when the script
# reports a ratchet — new crossings outside the baseline are reported in
# the PR comment but do NOT fail CI (the Group H detective audit and the
# local pre-commit hook handle those).

on:
  pull_request:
    branches: [main]
  # Also on every merge, so a file that crosses its size baseline ONLY when two
  # pull requests combine is visible on `main` at all. Each was green alone;
  # nothing looked at the result. The PR-comment step below is already
  # `pull_request`-gated, so it stays a no-op here.
  push:
    branches: [main]
  workflow_dispatch:

# `pull_request` (not pull_request_target) keeps untrusted fork PR code
# from running with elevated privileges. Least-privilege GITHUB_TOKEN
# (OpenSSF Scorecard Token-Permissions): the top-level token is read-only;
# the bloat-check job widens itself to pull-requests:write for its comment step.
permissions:
  contents: read

concurrency:
  group: bloat-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bloat-check:
    name: Anti-ratchet + allowlist diff
    runs-on: ubuntu-latest
    # pull-requests:write — required by the "Post / update PR comment" step.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On a push the PR field is empty; fall back to the pushed commit
          # rather than relying on an empty `ref` meaning "the default".
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        # Third-party action pinned to a full commit SHA (supply-chain
        # hardening); trailing comment records the human-readable tag.
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Resolve base ref
        id: base
        shell: bash
        run: |
          set -euo pipefail
          # PR: the base of the pull request. Push: the commit `main` was at
          # before this merge. Guarded, because `event.before` is the all-zero
          # SHA for a first push and can be unresolvable after a rewrite — and
          # `git show ":path"` on an EMPTY base silently reads the INDEX, which
          # would compare the baseline against itself and report no drift at all.
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          zero="0000000000000000000000000000000000000000"
          if [ -z "$base_sha" ] || [ "$base_sha" = "$zero" ] \
             || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "base_available=false" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
          else
            echo "base_available=true" >> "$GITHUB_OUTPUT"
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture base baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.base.outputs.base_available }}" = "true" ]; then
            git show "${{ steps.base.outputs.base_sha }}:shipwright_bloat_baseline.json" \
                > /tmp/baseline_base.json 2>/dev/null \
                || echo '{"version":1,"entries":[]}' > /tmp/baseline_base.json
          else
            echo "::notice::no resolvable base for this event — the allowlist diff is computed against an EMPTY baseline, so every entry reads as new"
            echo '{"version":1,"entries":[]}' > /tmp/baseline_base.json
          fi

      - name: Run anti-ratchet check (worktree mode)
        id: ratchet
        run: |
          set +e
          uv run shared/scripts/hooks/anti_ratchet_check.py \
              --project-root . \
              --worktree --json > /tmp/ratchet.json 2> /tmp/ratchet.stderr
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/ratchet.json
          echo "----- stderr -----"
          cat /tmp/ratchet.stderr || true

      - name: Build allowlist diff
        id: diff
        run: |
          uv run shared/scripts/hooks/build_bloat_diff.py \
              --base /tmp/baseline_base.json \
              --head shipwright_bloat_baseline.json \
              --ratchet /tmp/ratchet.json \
              > /tmp/diff.md

      - name: Post / update PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          DIFF_PATH: /tmp/diff.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- shipwright-bloat-check -->';
            const body = marker + '\n' + fs.readFileSync(process.env.DIFF_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const prior = existing.find(c => c.body && c.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: prior.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Fail on anti-ratchet
        if: ${{ steps.ratchet.outputs.exit_code != '0' }}
        run: |
          echo "::error::anti-ratchet block — see PR comment + workflow log"
          cat /tmp/ratchet.stderr
          exit 1
