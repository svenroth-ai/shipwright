name: Ubuntu 26 Runner Validation (temporary)

# TEMPORARY probe, not a permanent gate — delete this file once it has served
# its purpose. `ubuntu-latest` migrates from Ubuntu 24.04 to 26.04 between
# 2026-10-19 and 2026-11-19 (github.com/actions/runner-images#14748). None of
# ci.yml / security.yml's scanner-install steps pin `ubuntu-24.04`-specific
# behavior, but two of them install into the RUNNER'S SYSTEM Python rather
# than a self-managed one, so this checks them explicitly against the new
# image ahead of the automatic switch, using the `ubuntu-26.04` label GitHub
# already makes available for early opt-in testing (same issue, "Mitigation
# ways"). Manual-only: never runs on a PR/push trigger, so it cannot become an
# accidental required check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Scanner installs on ubuntu-26.04
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: OS identification
        run: cat /etc/os-release

      - name: Install uv
        # Same pin as ci.yml's "Install uv" step.
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          enable-cache: true

      - name: Install Python 3.11 via uv (self-managed, not the system Python)
        run: |
          uv python install 3.11
          uv run --python 3.11 python --version

      - name: Ruff via uvx (pinned, same as ci.yml's lint step)
        run: uvx ruff@0.15.15 --version

      - name: Install Semgrep (system pip — the step under test)
        # ci.yml / security.yml run this against whatever `pip`/`python3` the
        # runner puts on PATH by default. That default Python jumps from
        # ~3.12 (Ubuntu 24.04 image) to 3.14 (Ubuntu 26.04 image) — the one
        # real exposure identified for this repo's workflows.
        run: |
          python3 --version
          pip install semgrep
          semgrep --version

      - name: Install Trivy (apt repo — same steps as ci.yml)
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Install Gitleaks (pinned binary download — same steps as ci.yml)
        shell: bash
        run: |
          GITLEAKS_VERSION="8.21.2"
          GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -qO "$TARBALL" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "$TARBALL"
          sudo mv gitleaks /usr/local/bin/
          rm -f "$TARBALL"
          gitleaks version
