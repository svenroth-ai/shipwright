name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN (OpenSSF Scorecard Token-Permissions): this
# workflow only reads — checkout + lint + tests, no writes — so the top-level
# token is read-only and no job widens it.
permissions:
  contents: read

concurrency:
  # On `main` the group is per-COMMIT and cancelling is off, so EVERY merge is
  # verified. That is the prerequisite for attribution: with one shared group,
  # two merges landing close together cancelled each other and a red result
  # covered N commits at once, so "P green, C red ⇒ C is the first bad commit"
  # was not a fact about anything. Per-commit — not merely cancel-in-progress:
  # false — because a shared group with cancelling off QUEUES the runs instead,
  # serialising every merge behind the one before it.
  # On a PR the group stays per-ref and a new push still supersedes the old run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-checks:
    # Type-checking is a deliberate won't-do for this repo (see dismissed
    # triage trg-84f204ba), so the job name does not claim it.
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Diff-coverage roadmap Phase 1: the "Diff coverage" step compares the
          # working tree against origin/main, so it needs the merge-base. The
          # default depth-1 checkout has no history — fetch it all.
          fetch-depth: 0

      - name: Install uv
        # Third-party action pinned to a full commit SHA (supply-chain
        # hardening): a mutable tag like @v3 can be repointed by the upstream
        # owner. The trailing comment records the human-readable tag.
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install root dependencies
        run: uv sync

      - name: Lint (ruff)
        # Bug-focused, GATING lint. The curated ruleset lives in the root
        # pyproject.toml ([tool.ruff.lint]). Run via uvx with a pinned ruff
        # version (ruff is not a project dependency, and pinning prevents a
        # new ruff release from silently breaking the gate). This step gates:
        # no `|| true`, no `continue-on-error`.
        run: uvx ruff@0.15.15 check .

      # OSS security scanners — the shipwright-security plugin's
      # test_oss_backend_smoke.py smoke tests hard-fail in CI when these
      # binaries are absent (ADR-044). The plugin-test loop below runs every
      # plugin's suite, so CI needs the scanners on PATH. Mirrors security.yml.
      - name: Install Semgrep
        run: pip install semgrep

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install Gitleaks
        shell: bash
        run: |
          # Download to disk + verify SHA256 before extracting (supply-chain
          # integrity): the old `wget | tar` piped an unverified tarball
          # straight into extraction. `shell: bash` (set above) runs with
          # `-eo pipefail`, so a checksum mismatch anywhere in a pipeline
          # aborts the step (the implicit default shell is only `bash -e`).
          GITLEAKS_VERSION="8.21.2"
          GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -qO "$TARBALL" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "$TARBALL"
          sudo mv gitleaks /usr/local/bin/
          rm -f "$TARBALL"
          gitleaks version

      - name: Plan test-root JUnit outputs
        # AC4: every test-root pytest step below writes its own --junit-xml
        # to a path resolved from ONE upfront plan.json, using the SAME
        # base convention F0's retention (AC2) uses via
        # shared/scripts/lib/suite_root_plan.py — never a hand-maintained
        # root-to-path table duplicated across this file. Needs pytest
        # importable: it loads conftest.py's discover_test_roots, which
        # itself does `import pytest` — a dev-only optional dependency, so
        # `--with pytest` here, same as the test steps below.
        run: uv run --with pytest shared/scripts/tools/ci_junit_plan.py plan --out .ci-junit

      - name: Run plugin tests
        shell: bash
        run: |
          set -e
          # Diff-coverage roadmap Phase 2: this is the FIRST coverage-producing
          # tier, so clear stale coverage state once here (a later per-tier `rm`
          # would wipe earlier tiers' data). Each plugin's scripts/ source is
          # measured into its own .cov-data/.coverage.<name> file; combine_coverage
          # folds them into one repo-relative coverage.xml after all tiers run.
          rm -rf .cov-data coverage.xml
          mkdir -p .cov-data
          ROOT="$PWD"
          for plugin in plugins/*/; do
            if [ -f "$plugin/pyproject.toml" ] && [ -d "$plugin/tests" ]; then
              name=$(basename "$plugin")
              echo "--- Running tests in $plugin ---"
              # AC4: this root's planned --junit-xml, read from the Plan step's
              # plan.json (absolute path, so it survives the `cd` below).
              junit_out=$(jq -r --arg r "plugins/$name/tests" \
                '.[] | select(.rel_root==$r) | .junit_out' .ci-junit/plan.json)
              # Plugins declare pytest as an optional `dev` extra (or not at
              # all), so a plain `uv sync` does not install it. `uv run --with`
              # provisions pytest + pytest-mock on top of the plugin's own env.
              if [ -d "$plugin/scripts" ]; then
                # Plugin suites run `cd "$plugin"` in their own uv env, so
                # coverage records plugin-CWD-relative `scripts/...` paths.
                # --cov-config pins the root pyproject so relative_files is
                # honoured (coverage does NOT search parent dirs for config);
                # combine_coverage.py later remaps `scripts/...` ->
                # `plugins/<name>/scripts/...`. Additive; never gates this step.
                (cd "$plugin" && COVERAGE_FILE="$ROOT/.cov-data/.coverage.$name" \
                  uv run --with pytest --with pytest-mock --with pytest-cov \
                  pytest tests/ -v --junit-xml="$junit_out" \
                  --cov=scripts --cov-config="$ROOT/pyproject.toml" --cov-report=)
              else
                # No scripts/ dir (e.g. shipwright-preview) — run tests, no cov.
                (cd "$plugin" && uv run --with pytest --with pytest-mock pytest tests/ -v --junit-xml="$junit_out")
              fi
            fi
          done

      - name: Run shared tests
        shell: bash
        run: |
          set -e
          # The shared/ suites historically NEVER ran in CI — only
          # plugins/*/tests/ + integration-tests/ did — which is how regressions
          # under shared/ rotted unseen (iterate-2026-05-31-ci-shared-tests).
          #
          # They must run as SEPARATE per-dir invocations: shared/tests/ and
          # shared/scripts/tests/ are each their own top-level `tests` package
          # (each carries __init__.py + a conftest.py), so collecting more than
          # one in ONE pytest process collides on the duplicate top-level
          # package name (ModuleNotFoundError / ImportPathMismatchError on
          # `tests.conftest`). One process per dir = one `tests` package = no
          # collision. Same pattern as the per-plugin loop above. The root
          # pyproject.toml supplies `-m 'not slow'` + pythonpath, so no extra
          # flags are needed here.
          # `not cross_plugin`: tests importing another plugin's lib/tools
          # collide on the shared `tests`/`lib` namespace from a shared/tests
          # session and hard-fail in CI by design (ADR-044 / test_hygiene
          # .import_or_fail_in_ci) — they run under their owning plugin's
          # session via the per-plugin loop above. A command-line `-m` replaces
          # the pyproject `-m 'not slow'`, so restate `not slow` here.
          #
          # Diff-coverage roadmap Phase 2: measure the shared/ tier into its own
          # per-tier data file (.cov-data/.coverage.shared). Run from the repo
          # root, so coverage records repo-relative `shared/...` paths (no remap
          # needed at combine time). --cov-append accumulates across the three
          # separate pytest processes; --cov-config pins the root pyproject
          # (relative_files + test omit). The stale-state clear + the combined
          # `coverage xml` now live in the plugin-tests and Combine steps
          # respectively. Coverage is additive and never gates this step;
          # --cov-report= silences the per-run terminal table.
          # --with diff-cover: the diff-coverage GATE fail-path integration test
          # (shared/scripts/tools/tests/test_measure_diff_coverage_gate.py, Phase-4
          # hardening) drives the real diff-cover against a synthetic repo to prove
          # the gate bites. Pinned so a release can't change flags/exit codes; the
          # test HARD-FAILS in CI if diff-cover is absent (silent-skip discipline).
          export COVERAGE_FILE="$PWD/.cov-data/.coverage.shared"
          for dir in shared/tests shared/scripts/tests shared/scripts/tools/tests; do
            echo "--- Running tests in $dir ---"
            # AC4: this root's planned --junit-xml (see the Plan step above).
            junit_out=$(jq -r --arg r "$dir" '.[] | select(.rel_root==$r) | .junit_out' .ci-junit/plan.json)
            uv run --with pytest --with pytest-mock --with pytest-cov \
              --with "diff-cover==10.3.0" \
              pytest "$dir" -v -m "not slow and not cross_plugin" --junit-xml="$junit_out" \
              --cov=shared --cov-append --cov-config="$PWD/pyproject.toml" --cov-report=
          done

      - name: Run integration tests
        # Diff-coverage roadmap Phase 2: integration-tests exercise the shared/
        # cross-plugin machinery from the repo root (repo-relative `shared/...`
        # paths -> no remap). Measured into its own per-tier data file so it
        # contributes to the combined coverage.xml below. Must run BEFORE the
        # Combine step. Coverage additive; never gates.
        shell: bash
        run: |
          if [ -d integration-tests ]; then
            # AC4: this root's planned --junit-xml (see the Plan step above).
            junit_out=$(jq -r --arg r "integration-tests" '.[] | select(.rel_root==$r) | .junit_out' .ci-junit/plan.json)
            COVERAGE_FILE="$PWD/.cov-data/.coverage.integration" \
              uv run --with pytest --with pytest-mock --with pytest-cov \
              pytest integration-tests/ -v --junit-xml="$junit_out" \
              --cov=shared --cov-config="$PWD/pyproject.toml" --cov-report=
          fi

      - name: Combine coverage
        # Diff-coverage roadmap Phase 2: fold every per-tier data file in
        # .cov-data/ (shared + integration + each plugin) into ONE repo-relative
        # coverage.xml. combine_coverage.py remaps each plugin's scripts/-relative
        # data to plugins/<name>/scripts/ — a single global `coverage combine`
        # [paths] mapping cannot, because the plugin identity is lost in the
        # plugin-CWD-relative data files (see the tool docstring). Absent-safe;
        # never gates. This produces the coverage.xml the Diff coverage step and
        # the coverage.total recorder consume.
        #
        # always(): still combine whatever tiers succeeded even when an earlier
        # test tier failed the job, so the coverage artifact is available for
        # debugging (matches the Upload step below). The failing test step keeps
        # the job red on its own — this never masks a failure, it only preserves
        # the diagnostic. combine_coverage is absent-safe (n/a, exit 0) with no
        # data, so a job that failed before any tier ran stays clean here.
        if: always()
        shell: bash
        run: |
          uv run --with coverage shared/scripts/tools/combine_coverage.py \
            --project-root . --data-dir .cov-data --output coverage.xml

      - name: Diff coverage (gate)
        # HARD GATE via the SHARED composite action (Stage 3 self-consume,
        # iterate-2026-07-07-diff-coverage-self-consume). The gate DECISION —
        # % of CHANGED lines (vs origin/main) tests execute over the COMBINED
        # coverage.xml, pinned diff-cover, exit non-zero iff diff% < 80 — now
        # lives in ONE place, `.github/actions/diff-coverage-gate`, consumed by
        # the adopt templates + WebUI + (here) the monorepo itself. Referenced by
        # a LOCAL `./` path, NOT `@main`: a PR that edits the action is gated by
        # its OWN checkout (no stale-@main bootstrapping) and there is no
        # mutable-action-tag finding. No continue-on-error, so an under-tested PR
        # (changed lines < 80% covered) BLOCKS the merge; the action's `set -e` +
        # a non-zero diff-cover exit fails closed on a crash too. 80 ==
        # control_grade._DIFF_COV_WARN_THRESHOLD (the action's fail-under default).
        # The CI-gate guard recognizes `diff-coverage-gate` in `uses` as a gate
        # (GATE_USES), so a future continue-on-error on this step is caught as a
        # loose, un-allowlisted gate. The dashboard number
        # (.shipwright/coverage/diff_coverage.json) is still produced LOCALLY by
        # measure_diff_coverage.py during compliance regen — it was never consumed
        # in CI. Skipped when Combine produced no coverage.xml. The action fetches
        # origin/main itself (needs the job's fetch-depth: 0 checkout).
        if: hashFiles('coverage.xml') != ''
        uses: ./.github/actions/diff-coverage-gate
        with:
          coverage-files: coverage.xml

      - name: Upload coverage artifacts
        # Non-gating housekeeping: keep the combined coverage.xml for inspection.
        # always() so a failed earlier step still publishes it. (The diff-cover
        # report is printed to the log by the gate action above.)
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: repo-diff-coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Repair-PR safety (gate)
        # AC-6 of the `main` self-heal (FR-01.19), enforced rather than advised.
        # A branch that repairs itself must never do it by adjusting a test
        # until it is green, so a PR that DECLARES itself a repair — the one
        # grammar `fix-main-<sha12>`, shared with the claim matcher in
        # lib/main_health_diagnosis.py — has its merge-base diff checked for
        # coverage that disappeared.
        #
        # The checker is materialised from the pull request's BASE revision and
        # run from there, NOT from the checked-out head. A repair that edited
        # the checker would otherwise be judged by its own edit, which is not an
        # enforcement boundary — and it would fail exactly when it matters, on
        # an agent "fixing" a red run by touching the thing that reported it.
        # `git show` writes elsewhere, so the PR's own tree stays intact for the
        # checker to examine. Fails CLOSED: `set -e` plus a non-zero exit from
        # the tool, and no continue-on-error. The checkout above is
        # fetch-depth: 0, so the base SHA is present.
        if: ${{ github.event_name == 'pull_request' && contains(github.head_ref, 'fix-main-') }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          gate="$RUNNER_TEMP/repair-gate"
          mkdir -p "$gate/lib" "$gate/tools"
          : > "$gate/lib/__init__.py"
          : > "$gate/tools/__init__.py"
          git show "$base:shared/scripts/lib/assertion_weakening.py" > "$gate/lib/assertion_weakening.py"
          git show "$base:shared/scripts/tools/check_repair_safety.py" > "$gate/tools/check_repair_safety.py"
          uv run python "$gate/tools/check_repair_safety.py" \
            --project-root . --base "$base"

      - name: Run CI-gate guard
        # Fails if a test dir is silently uncovered, a quality gate goes loose
        # outside the documented allowlist, or the security critical-gate loses
        # its fail-closed missing-findings guard. See
        # shared/scripts/tools/check_ci_gate_coverage.py.
        run: uv run shared/scripts/tools/check_ci_gate_coverage.py --project-root .

      - name: Contract surface (gate)
        # The per-producer unit gates pin the shape the code WOULD emit. This
        # drives the real command a consumer runs (`grade.py --format json`,
        # `analyze_codebase.py`) against a real repo and parses the real bytes —
        # the only check that catches a wrapper, a custom encoder or a changed
        # CLI flag altering the output while every unit gate stays green.
        # It existed and was referenced by no workflow: it ran nowhere and gated
        # nothing. Wired here so it BLOCKS.
        run: uv run scripts/verify_contract_surface.py

      - name: Sweep delivery surface (gate)
        # Same shape, same fix: the end-to-end proof that an operator's dismiss
        # survives the outbox sweep to origin rather than being quarantined.
        # Also referenced by nothing until now.
        run: uv run scripts/verify_sweep_delivery_surface.py

      - name: Verify test-root JUnit coverage (gate)
        # AC4: every root planned above must actually have produced its
        # --junit-xml — a silently-dropped root would either read as false
        # structural drift in the next step's manifest comparison, or get
        # masked as a "platform-selection difference" it is not (External
        # Review, both reviewers).
        run: uv run shared/scripts/tools/ci_junit_plan.py verify --plan .ci-junit/plan.json

      - name: Check traceability manifest against a fresh regeneration
        # SPEC D8 (second half): regenerate .shipwright/compliance/
        # test-traceability.json from THIS run's real, fresh JUnit reports and
        # compare it against the committed one. Deliberately NOT named
        # "...(gate)" and registered in NO allowlist:
        # ci_manifest_drift_check.py's own exit code is 0 (no drift) / 1
        # (structural drift, advisory) / 2 (a real step failure — git show,
        # staging, or regeneration itself crashed). Only exit 2 fails this
        # step; exit 1 is reported via ::warning:: and the job stays green.
        # This if-scoped form (never a trailing `|| true` / `|| exit 0`) is
        # why check_ci_gate_coverage.py's is_loose() correctly leaves this
        # alone: a suppression only counts when it shares ONE line with a
        # recognized gate command, and this step's run body matches no
        # GATE_COMMAND and its name carries no GATE_NAME_KEYWORD — it is not
        # classified as a gate step at all, so LOOSE_GATE_ALLOWLIST needs no
        # new entry (one would itself fail stale_allowlist_entries(), since
        # the guard would find nothing loose to match it against). Advisory
        # until proven reliable over several consecutive green PRs — see the
        # iterate spec's AC4 design note for what has to be true before this
        # becomes a real gate.
        id: manifest_drift
        shell: bash
        run: |
          set +e
          uv run shared/scripts/tools/ci_manifest_drift_check.py \
            --project-root . --run-id "${{ github.run_id }}" \
            --head-commit "${{ github.sha }}" --plan .ci-junit/plan.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::warning::Traceability manifest structural drift detected against the committed one (advisory, not blocking) - see the step log above."
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Upload regenerated traceability manifest artifact (execution evidence)
        # P3.5 restart (2026-09-09): the drift-check step above regenerates this file IN PLACE
        # from this run's real JUnit output before comparing it. Discarding it here (as before)
        # threw away the one thing that makes a promotion's tests/coverage fields non-forgeable
        # — see ci_execution_evidence.py's module docstring for the full design.
        #
        # `if:` narrowed to code=='0' ONLY (round-2 plan review, Q2) -- an artifact uploaded on
        # drift-code '1' is dead storage anyway: "Confirm traceability manifest verified (no
        # drift)" is ITSELF gated on code=='0' (below), so a run with code=='1' can never become
        # `verified` and its artifact would never be consulted regardless.
        #
        # continue-on-error: true, deliberately diverging from "Upload coverage artifacts"'
        # precedent (which has none) -- that step is a debugging aid; this one is the wire this
        # restart's WHOLE unforgeability claim rests on, and a transient upload failure must
        # never become a NEW way for ci.yml to fail the build. IMPORTANT: with
        # continue-on-error: true this step's own `conclusion` always reads `success` even when
        # the upload itself failed -- only `outcome` reflects the real result. Nothing in this
        # design reads this step's conclusion (unlike PROVENANCE_STEP_NAME); the resolver always
        # asks the Artifacts API directly whether the named artifact actually exists for this
        # run_id, so a swallowed failure here correctly surfaces there as `unavailable`, never as
        # a false `confirmed`.
        if: steps.manifest_drift.outputs.code == '0' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: traceability-manifest-regenerated   # EXECUTION_EVIDENCE_ARTIFACT_NAME constant
          path: .shipwright/compliance/test-traceability.json   # literal path, not a glob
          if-no-files-found: ignore
          retention-days: 90   # explicit, matching the repo default -- pinned so a future
                                # org-level default change can't silently shrink the window
                                # this design's "artifact retention" Known Limitation assumes

      - name: Confirm traceability manifest verified (no drift)
        # P3.4c (iterate-2026-09-08-ci-provenance-attestation): the ONLY
        # purpose of this step is to exist as a queryable STEP CONCLUSION.
        # `shared/scripts/ci_provenance.py` asks GitHub's Actions Jobs API
        # for a step named exactly PROVENANCE_STEP_NAME (that constant, not
        # a hand-copied literal, is what a CI-YAML-shape test pins this
        # `name:` against) on a qualifying (push, default-branch,
        # conclusion=success) run — its conclusion is `success` if and only
        # if the drift check above found no drift (`code == '0'`), `skipped`
        # otherwise. No fallible logic, so no `continue-on-error` is needed:
        # a bare echo cannot fail, and this step adds no new failure
        # condition to the job.
        if: steps.manifest_drift.outputs.code == '0'
        run: echo "manifest verified clean at ${{ github.sha }}"

      - name: Keystone AC gate (gate)
        # P3.6 (campaign req3-04c-ac-identity-wave2, design
        # .shipwright/planning/iterate/2026-09-09-p3-6-keystone-gate.md). SPEC 1.4: a
        # behaviour-changing PR must not merge without naming its changed acceptance
        # criteria and re-running the tests bound to them, green, in THIS run.
        #
        # MUST come after "Check traceability manifest against a fresh regeneration":
        # that step regenerates .shipwright/compliance/test-traceability.json IN PLACE
        # from this run's real JUnit output, so the committed file's own claims are
        # already overwritten before this gate reads them. Regeneration happens BEFORE
        # that step's own comparison, so this holds even while `main` carries the
        # advisory structural drift (code '1'); code '2' FAILS that step and — with the
        # default `if: success()` — this one never runs. Fail-closed, no extra `if:`.
        #
        # No ordering assertion against "Diff coverage (gate)": that step is conditional
        # on hashFiles('coverage.xml'), so depending on it would pin a hard precondition
        # on a soft dependency.
        #
        # pull_request only: the keystone gate is a MERGE condition. A push run has no PR
        # to block and no base branch to diff against.
        #
        # The name ends in "(gate)" so check_ci_gate_coverage.GATE_NAME_KEYWORDS enrols
        # it — a future `continue-on-error` here is then caught as a loose gate rather
        # than silently disarming the campaign's keystone.
        if: github.event_name == 'pull_request'
        run: uv run shared/scripts/tools/check_keystone_ac_gate.py --project-root . --head-sha "${{ github.sha }}"

      - name: AC coverage ratchet (gate)
        # P3.7 feeder (a) (campaign req3-04c-ac-identity-wave2, design
        # .shipwright/planning/iterate/2026-09-10-p3-7-feeder-checks.md). SPEC §8
        # E2: "AC without a test" is ANTI-RATCHETED against
        # shipwright_ac_coverage_baseline.json — 259 of 268 minted ACs have no
        # binding today (P3.6 design §2.1), so this only blocks a NEW unbound AC
        # outside the grandfathered baseline, never the existing backlog. Its
        # sibling below ("a test whose AC vanished") is the OPPOSITE case — hard
        # from day one, no baseline — and that asymmetry is deliberate (SPEC §8
        # E2, restated in the script's own module docstring).
        #
        # Same ordering requirement as the Keystone gate above and for the same
        # reason: must run AFTER the manifest-regeneration step, which overwrites
        # .shipwright/compliance/test-traceability.json in place from THIS run's
        # real JUnit output before this gate reads it.
        #
        # ALSO runs on push to main (trg-e69bf1ba / iterate-2026-09-11-ac-ratchet-
        # push-observe) — the one feeder that can, because it needs no merge base
        # (`check_ac_coverage_ratchet.py` only ever reads HEAD's own manifest +
        # baseline, never `--base-sha`/`--head-sha`; unlike the Keystone gate and
        # the Orphan AC binding gate below, which are genuine merge conditions
        # with nothing to diff against on a push). Before this, the baseline was
        # observed at exactly one point in its lifecycle — inside the introducing
        # PR — and never again automatically.
        #
        # External code review (openai, HIGH) on the first version of this fix:
        # re-running the SAME comparison against the SAME committed baseline on
        # push detects NOTHING new for a same-PR self-grandfathered entry — by
        # the time that commit reaches `main`, the baseline already contains it,
        # so `new_unbound` is empty exactly as it was inside the introducing PR.
        # `--check-baseline-growth` (push only) is the actual fix for that:
        # `verifiers/_ac_baseline_growth.py` diffs the baseline file's own
        # committed bytes against `--parent-sha` and blocks if it grew, which
        # is exactly what a same-PR `--write` self-grandfather does to the
        # file. `--parent-sha` is the push event's own `before` SHA — main's
        # tip immediately before THIS push — never a bare `HEAD~1` (external
        # code review, openai, HIGH, second round): a push can carry more
        # than one commit (a non-squash merge, a rebase-merge, a direct
        # multi-commit push — all real paths a solo-maintainer `--admin`
        # override can take), and if the baseline grew in an EARLIER commit
        # of that push while the pushed tip leaves it untouched, `HEAD~1`
        # already contains the grown entry and would silently miss it;
        # `before` covers the whole pushed range regardless of commit count.
        # This job stays read-only throughout (see `permissions:` above) —
        # nothing here rewrites the baseline, it only reads two commits'
        # worth of it.
        #
        # This surfaces the self-grandfather as a red run rather than
        # durably closing it (Stage-3 doubt review): the push run is not a
        # required PR check, and it self-clears the FOLLOWING push once the
        # grown entry is already inside every later `before` — a missed red
        # run gets no further automated signal for that entry.
        #
        # What this still does NOT close, disclosed rather than silently
        # dropped: an AC already listed in the baseline that regresses (bound,
        # then unbound again) in a commit that never touches the baseline FILE
        # itself changes none of its bytes, so the growth diff cannot see it
        # either. Real closure needs a periodic full `--write` refresh or a
        # persisted resolution ledger with cross-run memory — real design work,
        # named but not built in `.shipwright/planning/iterate/2026-09-10-p3-7-
        # feeder-checks.md` §7, and not built here either; tracked as a
        # follow-up rather than claimed as fixed.
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: uv run shared/scripts/tools/check_ac_coverage_ratchet.py --project-root . ${{ github.event_name == 'push' && format('--check-baseline-growth --parent-sha "{0}"', github.event.before) || '' }}

      - name: Orphan AC binding (gate)
        # P3.7 feeder (b) (same campaign, same design doc). SPEC §8 E2: "a test
        # whose AC vanished" is HARD from day one — no baseline, because nothing
        # has ever validated a @covers tag's AC id still exists, so there is no
        # legacy backlog to grandfather. Catches three named shapes (two-PR
        # unbind sequence -- whenever the base manifest's own record of the
        # binding is trustworthy, not unconditionally; outright deletion; id
        # rotation -- P3.6 design doc §7 / §10 item 8b, triage card
        # trg-f68795d2): see the script's own module docstring for the
        # two-arm mechanism.
        #
        # Same ordering + pull_request-only reasoning as the two gates above.
        if: github.event_name == 'pull_request'
        run: uv run shared/scripts/tools/check_orphan_ac_binding.py --project-root . --head-sha "${{ github.sha }}"

      - name: Check-body suspects (advisory, non-blocking)
        # The third, lower-priority item P3.7's own sub-iterate spec named and
        # explicitly deferred (design
        # .shipwright/planning/iterate/2026-09-10-p3-7-feeder-checks.md,
        # "Deferred" section), delivered here bundled with P3.8 (provenance:
        # trg-33a474e2, filed by P3.7's own runner and amended by an operator
        # to bundle in trg-c2329759, p3.8's own tracker card, which was then
        # dismissed into it -- see the design doc's Section 12). Same class
        # as P3.6's own design doc names in §7
        # and P3.8's own sub-iterate spec restates: "mechanics raise a flag, a
        # human decides" -- an AC whose own criterion text is UNCHANGED but a
        # test bound to it had its BODY edited in this diff is a SIGNAL for a
        # human to judge (refactor vs. quiet weakening), never a verdict.
        #
        # Deliberately NOT named "...(gate)" and carries no word from
        # check_ci_gate_coverage.GATE_NAME_KEYWORDS (same reasoning as "Check
        # traceability manifest against a fresh regeneration" above): this
        # step must never be mistaken for a merge gate. Its own CLI
        # (check_test_body_suspects.py) returns exit 0 UNCONDITIONALLY --
        # clean, an advisory finding, and an infra fault all report via the
        # JSON payload, never via the process exit code -- so there is no
        # `continue-on-error` here either; the guarantee lives in the script,
        # not the YAML.
        #
        # Same ordering + pull_request-only reasoning as the three gates
        # above (reads the same regenerated traceability manifest + real git
        # history for the base/head comparison).
        if: github.event_name == 'pull_request'
        run: uv run shared/scripts/tools/check_test_body_suspects.py --project-root . --head-sha "${{ github.sha }}"

