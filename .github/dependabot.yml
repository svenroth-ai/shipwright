# Shipwright Dependabot configuration
#
# Only the github-actions ecosystem is ACTIVE (weekly; minor/patch bumps
# grouped into one PR, majors separate; 7-day cooldown so a freshly published
# tag is not adopted the day it ships).
# Every pip ecosystem stays DORMANT (open-pull-requests-limit: 0): Python CVEs
# are caught by Trivy in security.yml. Dependabot *security updates* are a
# repo setting (Settings -> Code security), independent of this file; this
# repo has it ON, so a vulnerable dep still gets a fix PR regardless of the
# limit below. To activate a pip ecosystem, change its
# `open-pull-requests-limit: 0` to `5`.
#
# Every entry carries a `cooldown` so Semgrep's dependabot-missing-cooldown
# rule stays live (it is no longer excluded in security.yml) and would flag a
# future entry added without one.

version: 2
updates:
  # ------------------------------------------------------------------
  # Python — root project
  # ------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ------------------------------------------------------------------
  # Python — individual plugins
  # ------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/plugins/shipwright-build"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    labels: ["dependencies", "python", "plugin"]
    commit-message:
