  # npm — WebUI dependency scanning moved with the repo:
  # https://github.com/svenroth-ai/shipwright-webui/blob/main/.github/dependabot.yml
  # (WebUI extracted at v0.4.0, 2026-04-24.)

  # ------------------------------------------------------------------
  # GitHub Actions
  # ------------------------------------------------------------------
  # `directories` (not `directory`) so the composite action under
  # .github/actions/ is bumped together with the workflows that pin the same
  # action. Minor/patch bumps share ONE weekly PR; a major bump is left out of
  # the group and arrives as its own PR, so one breaking major cannot hold the
  # safe bumps hostage. No `labels` (the repo has no `dependencies`/`ci`
  # label) and no `include: scope` (it would append "(deps)" to the prefix and
  # break the Conventional Commit title).
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"
