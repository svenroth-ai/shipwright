[project]
name = "shipwright-security"
version = "0.2.0"
description = "Claude Code plugin for security scanning (OSS or Aikido) with automated remediation loop"
requires-python = ">=3.11"
readme = "../../README.md"
license = {text = "MIT"}
authors = [{name = "Sven Roth"}]
keywords = ["claude-code", "plugin", "security", "aikido", "sast", "sca"]
dependencies = [
    "requests>=2.31.0",
    # Only for scripts/tools/probe_glm_zdr.py (an ops verification tool, not the
    # production PR-review path — pr_review_openrouter.py stays stdlib-urllib-only
    # on purpose) and its test. Main dependency, not a dev extra: CI's per-plugin
    # test step (`uv run --with pytest ...` from inside the plugin dir) installs
    # this project's own `dependencies` implicitly but never passes `--extra dev`.
    "openai>=2.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = [".", "scripts"]
markers = [
    "integration: marks tests as integration tests",
    "smoke: real-binary scanner smoke tests (opt-in; skipped when binary missing)",
    "covers: binds a test to one or more FRs for requirement->test traceability (@FR tags, Spec D1)",
    "slow: marks tests that spawn subprocesses or perform long I/O",
]
